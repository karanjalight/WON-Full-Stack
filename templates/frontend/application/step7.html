{% extends 'frontend/application/base.html' %}
{% load static %}

{% block application_content %}
<div class="step-content text-center">
    <div class="processing-indicator mb-4">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Processing...</span>
        </div>
    </div>
    <h3 class="mb-4">Submitting Your Application</h3>
    <p class="text-muted">Please wait while we process your application...</p>
</div>

<form method="post" id="submitForm" style="display: none;">
    {% csrf_token %}
    <button type="submit" id="submitBtn"></button>
</form>

<script>
    // Auto-submit on page load after a short delay
    window.onload = function() {
        setTimeout(function() {
            document.getElementById('submitBtn').click();
        }, 1000);
    };
</script>
{% endblock %}
